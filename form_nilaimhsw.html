    <h2>Form Nilai Mahasiswa</h2>
    <form action="adddata_mhsw.php" method="post">
        <label for="nim">NIM:</label><br>

        <label for="NamaL">Nama Lengkap:</label><br>

        <input type="submit" value="Simpan">
    </form>
